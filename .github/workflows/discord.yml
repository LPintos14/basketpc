name: Publicar guías en Discord

on:
  push:
    branches: [main]
    paths: ["docs/**.md", "scripts/discord_sync.py"]
  workflow_dispatch:
    inputs:
      nuevo:
        description: "Crear las publicaciones de nuevo (ignorar las anteriores)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: discord

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar o actualizar en el foro de Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 scripts/discord_sync.py ${{ inputs.nuevo && '--nuevo' || '' }}

      - name: Guardar los IDs de los mensajes publicados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .discord/estado.json
          git diff --cached --quiet || { git commit -m "Actualizar estado de publicaciones en Discord"; git push; }
